name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # examples/rn-demo는 생성 파일 demo-config.ts를 import하지만 이 파일은
      # 서명 키에서 만들어지므로 gitignore 대상이다. lint와 typecheck 대상에
      # 포함되어 있어 검사 전에 생성해야 한다.
      - run: pnpm demo:build-content
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  android-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35"
      - run: pnpm install --frozen-lockfile
      - run: pnpm android:compile
      - run: pnpm android:test
      - run: pnpm android:assemble
      - run: pnpm --filter @webcapsule/react-native test

  android-instrumentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - run: pnpm fixtures:check
      - uses: reactivecircus/android-emulator-runner@v2.34.0
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            pnpm android:connected
            ./scripts/android-process-death.sh
